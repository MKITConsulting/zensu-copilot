name: Publish marketplace

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing stable release tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag to publish or retry (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-marketplace-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified release to Copilot marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify published release and merged source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          source_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$source_sha" origin/main
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName > "$RUNNER_TEMP/release.json"
          python3 -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/release.json")); assert not r["isDraft"] and not r["isPrerelease"] and r["tagName"]==os.environ["RELEASE_TAG"]'
          echo "RELEASE_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/release-assets"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-assets" \
            --pattern "zensu-copilot-${RELEASE_TAG#v}.tar.gz" --pattern build.json --pattern SHA256SUMS
      - name: Publish immutable package and catalog atomically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/publish-marketplace.py \
            --assets "$RUNNER_TEMP/release-assets" \
            --tag "$RELEASE_TAG" --source-sha "$RELEASE_SOURCE_SHA" \
            --repository "$RELEASE_REPOSITORY" \
            --work-dir "$RUNNER_TEMP/marketplace-publication" --push
