name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish native plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify release version and merged source
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -f "docs/releases/$GITHUB_REF_NAME.md"
      - name: Verify native package and integration tests
        run: npm run verify
      - name: Package plugin and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          mkdir -p dist/release
          tar -czf "dist/release/zensu-copilot-$version.tar.gz" -C dist zensu
          cp dist/zensu/build.json dist/release/build.json
          cd dist/release
          sha256sum "zensu-copilot-$version.tar.gz" build.json > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          gh release create "$GITHUB_REF_NAME" \
            "dist/release/zensu-copilot-$version.tar.gz" \
            dist/release/build.json dist/release/SHA256SUMS \
            --verify-tag --target "$GITHUB_SHA" \
            --title "Zensu for Copilot CLI $version" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" --latest
